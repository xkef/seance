[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained but pinned by fontdb/cosmic-text; revisit
    # when the font stack migrates.
    { id = "RUSTSEC-2026-0192", reason = "pinned by fontdb/cosmic-text; no fixed upgrade path yet" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Uzaaft/libghostty-rs"]
