[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # quick-xml < 0.41 DoS advisories. quick-xml is reachable only through
    # wayland-scanner, a build-time proc-macro that parses trusted protocol
    # XML shipped inside the wayland crates; the latest wayland-scanner
    # (0.31.10) still pins quick-xml ^0.39, so 0.41 is unreachable until
    # upstream bumps it.
    { id = "RUSTSEC-2026-0194", reason = "build-time only, trusted input; blocked on wayland-scanner" },
    { id = "RUSTSEC-2026-0195", reason = "build-time only, trusted input; blocked on wayland-scanner" },
    # ttf-parser is unmaintained but pinned by fontdb/cosmic-text; revisit
    # when the font stack migrates.
    { id = "RUSTSEC-2026-0192", reason = "pinned by fontdb/cosmic-text; no fixed upgrade path yet" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Uzaaft/libghostty-rs"]
