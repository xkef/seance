[package]
name = "seance-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = """
Top-level seance binary.

Owns the winit event loop, surface lifecycle, hot-reload of config and
themes, and platform glue (macOS Metal layer configuration, dead-key
composition, log directory resolution). Bootstraps the in-process mux
server on a background thread and drives a
`MuxClient<ProtocolDomain<InProcessTransport>>` so every operation
crosses the wire protocol even in local mode — the same architecture
that lights up M12's remote transports.
"""

[[bin]]
name = "seance"
path = "src/main.rs"

[dependencies]
# internal
seance-config.workspace = true
seance-input.workspace = true
seance-mux-client.workspace = true
seance-mux-server.workspace = true
seance-render.workspace = true

# external
arboard.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
pollster.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# external
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
raw-window-handle.workspace = true

[lints]
workspace = true
