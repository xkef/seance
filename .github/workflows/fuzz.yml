name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/seance-vt/**"
  schedule:
    - cron: "10 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vt-feed:
    name: fuzz vt_feed (smoke)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Setup vendored ghostty-src
        run: tools/setup-ghostty-src.sh
      - name: Setup vendored ghostty themes
        run: tools/setup-themes.sh
      - name: Setup macOS sysroot
        run: tools/setup-sysroot.sh
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-fuzz
      - name: Fuzz VT input path
        # Apple's ld-prime cannot link libFuzzer's C++ runtime
        # (___dso_handle fixup error); use the classic linker.
        env:
          RUSTFLAGS: "-Clink-arg=-Wl,-ld_classic"
        # --target pins the host triple: cargo-fuzz otherwise defaults to
        # the triple its own binary was built for (x86_64 from the
        # prebuilt download), which has no installed std.
        run: |
          cargo +nightly fuzz run vt_feed \
            --target "$(rustc +nightly -vV | sed -n 's/^host: //p')" \
            -- -max_total_time=120
