name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: tag/version consistency
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match workspace version
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2 "**/*.md"

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier --check "**/*.md"

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: cargo build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Setup vendored ghostty-src
        run: tools/setup-ghostty-src.sh
      - name: Setup vendored ghostty themes
        run: tools/setup-themes.sh
      - name: Setup macOS sysroot
        run: tools/setup-sysroot.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: no-cargo-bin
      - run: cargo build --workspace --all-targets

  clippy:
    name: cargo clippy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Install clippy component
        run: rustup component add clippy
      - name: Setup vendored ghostty-src
        run: tools/setup-ghostty-src.sh
      - name: Setup vendored ghostty themes
        run: tools/setup-themes.sh
      - name: Setup macOS sysroot
        run: tools/setup-sysroot.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: no-cargo-bin
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo nextest
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Setup vendored ghostty-src
        run: tools/setup-ghostty-src.sh
      - name: Setup vendored ghostty themes
        run: tools/setup-themes.sh
      - name: Setup macOS sysroot
        run: tools/setup-sysroot.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: no-cargo-bin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
