name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        description: "Build and checksum only; do not create or update a release"
        required: false
        type: boolean
        default: false

# Top-level token is read-only; only the release job is granted write.
permissions:
  contents: read

# One run per tag. Re-runs serialize rather than race for the same draft.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            dry_run="${INPUT_DRY_RUN:-false}"
          else
            tag="$REF_NAME"
            dry_run="false"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::no tag resolved from event $EVENT_NAME" >&2
            exit 1
          fi

          # Accept vMAJOR.MINOR.PATCH with an optional -prerelease / +build suffix.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::tag '$tag' is not a vX.Y.Z[-pre][+build] version tag" >&2
            exit 1
          fi

          # Core X.Y.Z: drop the leading v, then strip any -pre / +build metadata.
          tag_core="${tag#v}"
          tag_core="${tag_core%%[-+]*}"

          # Read the single source of truth: [workspace.package] version.
          version="$(awk '
            /^\[workspace\.package\]/ { in_pkg = 1; next }
            /^\[/                     { in_pkg = 0 }
            in_pkg && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)"

          if [[ -z "$version" ]]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "$tag_core" != "$version" ]]; then
            echo "::error::tag '$tag' (core $tag_core) disagrees with Cargo.toml workspace version $version" >&2
            exit 1
          fi

          short_sha="${SHA:0:7}"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "release_name=séance $version"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved $tag (version $version, $short_sha, dry_run=$dry_run)"

  # Placeholder build matrix. The real per-target builds land in their own
  # sub-issues — macOS universal #155, linux-x86_64 #156, linux-aarch64 #157,
  # and Debian packaging in package-deb #160 — each replacing one leg here with
  # a genuine compile + bundle step. Until then each leg emits a stub tarball so
  # the checksums and release wiring downstream is exercisable end to end.
  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-universal
          - linux-x86_64
          - linux-aarch64
    steps:
      - name: Assemble placeholder artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="seance-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cat > "dist/$name/PLACEHOLDER.txt" <<EOF
          Placeholder artifact for $name.
          The real $TARGET build is produced by its platform sub-issue
          (macOS #155, linux-x86_64 #156, linux-aarch64 #157).
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no build artifacts to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: release (draft)
    needs: [prepare, checksums]
    # dry_run runs (test builds) stop after checksums and create no release.
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List collected artifacts
        run: ls -R dist
      # action-gh-release is idempotent per tag: a re-run updates the existing
      # draft for ${tag} instead of creating a duplicate release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
